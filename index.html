<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aperio Financial Services | Integrated Financial Excellence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        h1, h2, h3 {
            font-family: 'Playfair+Display', serif;
        }
        .bg-brand { background-color: #B41F24; }
        .text-brand { color: #B41F24; }
        .border-brand { border-color: #B41F24; }
        
        /* Smooth scrolling for anchor links */
        html {
            scroll-behavior: smooth;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(10px); }
          to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideUp {
          from { opacity: 0; transform: translateY(40px) scale(0.95); }
          to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        @keyframes living-bounce {
          0%, 100% { transform: translateY(0) scale(1); }
          50% { transform: translateY(-12px) scale(1.04); }
        }

        @keyframes shimmer-once {
          0% { transform: translateX(-150%) skewX(-25deg); }
          100% { transform: translateX(150%) skewX(-25deg); }
        }

        .shimmer-btn {
          position: relative;
          overflow: hidden;
          transition: all 0.3s ease;
          --shimmer-rgb: 255, 255, 255;
        }

        .shimmer-red {
          --shimmer-rgb: 180, 31, 36;
        }

        .shimmer-btn::after {
          content: '';
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(
            to right,
            rgba(var(--shimmer-rgb), 0) 0%,
            rgba(var(--shimmer-rgb), 0.4) 50%,
            rgba(var(--shimmer-rgb), 0) 100%
          );
          transform: translateX(-150%) skewX(-25deg);
          pointer-events: none;
        }

        .shimmer-btn:hover::after {
          animation: shimmer-once 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .animate-fadeIn {
          animation: fadeIn 0.4s ease-out forwards;
        }
        .animate-slideUp {
          animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .animate-living-bounce {
          animation: living-bounce 5s ease-in-out infinite;
        }

        /* Tablet only version adjustment (769px to 1024px) */
        @media (min-width: 769px) and (max-width: 1024px) {
            .hero-container {
                padding-top: 22rem !important; /* Pushed significantly further down for tablet vertical centering */
            }
        }

        /* Mobile Responsiveness Overrides (max-width: 768px) */
        @media (max-width: 768px) {
            section {
                padding-top: 2.25rem !important;
                padding-bottom: 2.5rem !important;
            }
            .max-w-7xl, .container {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            .py-24 { padding-top: 2rem !important; padding-bottom: 2rem !important; }
            .mb-24, .mb-32, .mb-48 { margin-bottom: 1.5rem !important; }
            .mt-20, .mt-48 { margin-top: 1rem !important; }
            
            .hero-section-wrapper {
                align-items: flex-start !important;
                padding-top: 8.5rem !important;
            }

            .hero-container {
                padding-top: 0 !important; 
            }

            .hero-mobile-labels {
                margin-bottom: 1rem !important;
                gap: 0.4rem !important;
            }
            .hero-mobile-labels .label-item {
                padding-left: 0.4rem !important;
                padding-right: 0.4rem !important;
                padding-top: 0.1rem !important;
                padding-bottom: 0.1rem !important;
            }
            .hero-mobile-labels span {
                font-size: 7px !important;
                letter-spacing: 0.1em !important;
            }

            button:not(.fab-btn):not(.menu-btn):not(.nav-btn), 
            a[class*="bg-brand"]:not(.fab-btn):not(.menu-btn), 
            a[class*="border-2"]:not(.menu-btn), 
            .Link:not(.menu-btn) {
                width: 100% !important;
                display: block !important;
                text-align: center !important;
                padding: 0.85rem 0.5rem !important;
            }

            header {
                padding-top: 0.25rem !important;
                padding-bottom: 0.25rem !important;
            }
            .mobile-hide-secondary {
                display: none !important;
            }

            img {
                max-width: 100% !important;
                height: auto !important;
            }
        }
    </style>
